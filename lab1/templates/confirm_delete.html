<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Article</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .danger {
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }

        .delete {
            background: #e74c3c;
            color: white;
        }

        .cancel {
            background: #bdc3c7;
            color: black;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="box">

    <h2 class="danger">Are you sure?</h2>

    <p>You are about to delete:</p>

    <h3>{{ article.title }}</h3>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn delete">Yes, delete</button>
    </form>

    <a href="{% url 'article_page' article.id %}" class="btn cancel">
        Cancel
    </a>

</div>

</body>
</html>
